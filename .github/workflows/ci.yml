name: Python portability
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Enforce Python 3.9 source compatibility
        run: python -m unittest discover -s tests -p test_compatibility.py -v

      - name: Doctor with no player CLIs on PATH
        shell: bash
        run: |
          set +e
          out="$(PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/empty-home" \
            python ping-pong/scripts/rally.py doctor 2>&1)"
          code=$?
          set -e
          echo "$out"
          test "$code" -ne 0
          echo "$out" | grep -q 'PLAYERS.md'
          echo "$out" | grep -q 'No player CLIs'
          ! echo "$out" | grep -q 'Traceback'

      - name: Mock rally (credential-free)
        shell: bash
        run: |
          out="$RUNNER_TEMP/mock-rally"
          python ping-pong/scripts/rally.py \
            --idea "CI mock idea" -n 2 \
            --players mock:left,mock:right \
            --no-animation --out "$out"
          test -f "$out/final.md"
          test -f "$out/state.json"
          python -c "import json,sys; s=json.load(open(sys.argv[1],encoding='utf-8')); assert s['status']=='done', s['status']" "$out/state.json"

      - name: Engine, animation preferences, and process cleanup
        run: python -m unittest discover -s tests -p "test_*.py" -v
